name: TestFlight

# v1.0.0 같은 태그를 푸시하거나 Actions 탭에서 직접 실행하면 TestFlight에 업로드한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '정식 릴리스 태그 (예: v1.1). 비우면 build-N 프리릴리스'
        required: false
        default: ''

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 업로드마다 빌드 번호가 달라야 한다
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect 는 iOS 26 SDK(Xcode 26) 이상으로 빌드한 앱만 받는다
      - name: Check Xcode
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $sdk 로는 App Store Connect 에 올릴 수 없습니다. Xcode 26 이상이 필요합니다."
            exit 1
          fi

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Install API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # 시크릿을 붙여 넣을 때 흔히 생기는 형식 문제(줄바꿈 손실, \n 문자열, 앞뒤 공백,
          # base64 로 한 번 더 인코딩, BEGIN/END 줄 누락)를 정리해서 올바른 PEM 으로 저장한다
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64, os, re

          raw = os.environ["ASC_PRIVATE_KEY"].replace("\\n", "\n").replace("\r", "").strip()
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass

          match = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          label, body = (match.group(1), match.group(2)) if match else ("PRIVATE KEY", raw)
          body = re.sub(r"\s+", "", body)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = f"-----BEGIN {label}-----\n" + "\n".join(lines) + f"\n-----END {label}-----\n"
          with open(os.environ["KEY_PATH"], "w") as f:
              f.write(pem)
          PY
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY 가 올바른 .p8 키가 아닙니다. .p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터 -----END PRIVATE KEY----- 까지)를 그대로 붙여 넣어 주세요."
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # 예전 실행에서 CI 가 만든 개발 인증서가 남아 있으면 지운다 (지금은 아카이브에서 인증서를 만들지 않는다)
      - name: Clean up CI certificates
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          python3 scripts/asc_cleanup_certs.py

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      # 서명 없이 아카이브하고 내보낼 때 Apple 클라우드 배포 인증서로 서명한다.
      # (아카이브에서 자동 서명을 쓰면 러너마다 개발 인증서가 새로 만들어지고, 지울 때마다 "인증서 취소" 메일이 온다)
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Homefield.xcodeproj \
            -scheme Homefield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Homefield.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # 서명 없는 아카이브에는 entitlements 가 안 들어가서, 내보낼 때 App Group(앱·위젯 응원팀 공유)이 빠진다.
      # 인증서 없이 되는 임시(ad-hoc) 서명으로 entitlements 를 넣은 사본을 만들어 둔다. 내보낼 때 클라우드 인증서로 다시 서명된다.
      - name: Embed entitlements
        continue-on-error: true
        run: |
          cp -R "$RUNNER_TEMP/Homefield.xcarchive" "$RUNNER_TEMP/Entitled.xcarchive"
          APP="$RUNNER_TEMP/Entitled.xcarchive/Products/Applications/Homefield.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - --generate-entitlement-der \
            --entitlements HomefieldWidgets/HomefieldWidgets.entitlements "$APP/PlugIns/HomefieldWidgets.appex"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements Homefield/Homefield.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null || true

      - name: Upload to TestFlight
        run: |
          write_options() {
            cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          }
          set -o pipefail
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # export_archive <아카이브> <upload|export>
          export_archive() {
            write_options "$2"
            rm -rf "$RUNNER_TEMP/export"
            xcodebuild -exportArchive \
              -archivePath "$1" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/export" \
              "${auth[@]}"
          }
          # 먼저 entitlements 를 넣은 사본을 내보내 보고, IPA 에 App Group 이 들어갔는지 확인한 뒤 올린다
          entitled_ok=0
          if export_archive "$RUNNER_TEMP/Entitled.xcarchive" export; then
            ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$ipa" -d "$RUNNER_TEMP/ipa" || true
            for bundle in "$RUNNER_TEMP/ipa/Payload/Homefield.app" "$RUNNER_TEMP/ipa/Payload/Homefield.app/PlugIns/HomefieldWidgets.appex"; do
              echo "== $(basename "$bundle")"
              codesign -d --entitlements - "$bundle" 2>/dev/null | tee "$RUNNER_TEMP/ent.txt" || true
              grep -q "group.com.bravekoon.homefield" "$RUNNER_TEMP/ent.txt" || { echo "::warning::$(basename "$bundle") 에 App Group 이 없습니다"; entitled_ok=2; }
            done
            [ "$entitled_ok" = 0 ] && entitled_ok=1
          else
            echo "::warning::entitlements 를 넣은 아카이브 내보내기 실패"
          fi
          if [ "$entitled_ok" = 1 ] && export_archive "$RUNNER_TEMP/Entitled.xcarchive" upload; then
            echo "App Group 포함해서 업로드했습니다"
          elif export_archive "$RUNNER_TEMP/Homefield.xcarchive" upload; then
            echo "::warning::App Group 없이 업로드했습니다 (위젯이 앱 응원팀을 못 읽고 위젯에서 고른 팀만 씁니다)"
          else
            # 서명 없는 아카이브를 내보내지 못하면 예전 방식(자동 서명 아카이브)으로 한 번 더
            echo "::warning::서명 없는 아카이브 내보내기 실패, 자동 서명으로 다시 아카이브합니다"
            rm -rf "$RUNNER_TEMP/Homefield.xcarchive"
            xcodebuild archive \
              -project Homefield.xcodeproj \
              -scheme Homefield \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/Homefield.xcarchive" \
              "${auth[@]}" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
            export_archive "$RUNNER_TEMP/Homefield.xcarchive" upload
          fi

      - name: Clean up CI certificates (after)
        if: always() && env.KEY_PATH != ''
        run: python3 scripts/asc_cleanup_certs.py || true

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # 업로드된 빌드마다 GitHub 릴리스를 남긴다. v* 태그면 정식 릴리스, 직접 실행이면 build-N 프리릴리스. 변경 내역은 병합된 PR 목록으로 자동 작성.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)
          release_tag="$INPUT_RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" ]]; then
            # 버전 릴리스: 태그가 없으면 이 커밋에 만든다 (v1.1 등)
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "홈구장 ${release_tag} (빌드 ${BUILD_NUMBER})" \
              --generate-notes \
              --latest
          else
            gh release create "build-${BUILD_NUMBER}" \
              --target "$GITHUB_SHA" \
              --title "홈구장 ${version} (${BUILD_NUMBER})" \
              --generate-notes \
              --prerelease
          fi
