name: TestFlight

# v1.0.0 같은 태그를 푸시하거나 Actions 탭에서 직접 실행하면 TestFlight에 업로드한다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: '정식 릴리스 태그 (예: v1.1). 비우면 build-N 프리릴리스'
        required: false
        default: ''

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    permissions:
      contents: write
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # 업로드마다 빌드 번호가 달라야 한다
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect 는 iOS 26 SDK(Xcode 26) 이상으로 빌드한 앱만 받는다
      - name: Check Xcode
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::iOS SDK $sdk 로는 App Store Connect 에 올릴 수 없습니다. Xcode 26 이상이 필요합니다."
            exit 1
          fi

      - name: Check secrets
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret for $name is not set"; missing=1; fi
          done
          exit $missing

      - name: Install API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # 시크릿을 붙여 넣을 때 흔히 생기는 형식 문제(줄바꿈 손실, \n 문자열, 앞뒤 공백,
          # base64 로 한 번 더 인코딩, BEGIN/END 줄 누락)를 정리해서 올바른 PEM 으로 저장한다
          KEY_PATH="$KEY_PATH" python3 - <<'PY'
          import base64, os, re

          raw = os.environ["ASC_PRIVATE_KEY"].replace("\\n", "\n").replace("\r", "").strip()
          if "BEGIN" not in raw:
              try:
                  decoded = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
                  if "BEGIN" in decoded:
                      raw = decoded
              except Exception:
                  pass

          match = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", raw, re.S)
          label, body = (match.group(1), match.group(2)) if match else ("PRIVATE KEY", raw)
          body = re.sub(r"\s+", "", body)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = f"-----BEGIN {label}-----\n" + "\n".join(lines) + f"\n-----END {label}-----\n"
          with open(os.environ["KEY_PATH"], "w") as f:
              f.write(pem)
          PY
          if ! openssl pkey -in "$KEY_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY 가 올바른 .p8 키가 아닙니다. .p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터 -----END PRIVATE KEY----- 까지)를 그대로 붙여 넣어 주세요."
            exit 1
          fi
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Homefield.xcodeproj \
            -scheme Homefield \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Homefield.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Homefield.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # 업로드된 빌드마다 GitHub 릴리스를 남긴다. v* 태그면 정식 릴리스, 직접 실행이면 build-N 프리릴리스. 변경 내역은 병합된 PR 목록으로 자동 작성.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: *"?([^"]+)"?.*/\1/p' project.yml | head -1)
          release_tag="$INPUT_RELEASE_TAG"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
          fi
          if [[ -n "$release_tag" ]]; then
            # 버전 릴리스: 태그가 없으면 이 커밋에 만든다 (v1.1 등)
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "홈구장 ${release_tag} (빌드 ${BUILD_NUMBER})" \
              --generate-notes \
              --latest
          else
            gh release create "build-${BUILD_NUMBER}" \
              --target "$GITHUB_SHA" \
              --title "홈구장 ${version} (${BUILD_NUMBER})" \
              --generate-notes \
              --prerelease
          fi
