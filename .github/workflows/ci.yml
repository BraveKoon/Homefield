name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: HomefieldCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        working-directory: Packages/HomefieldCore
        run: swift test

  app-build:
    name: iOS app build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Homefield.xcodeproj \
            -scheme Homefield \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        # 로그 끝에서 바로 보이도록 오류 줄만 모아 다시 출력
        run: |
          grep -E "error:|warning: .*will be an error" build.log | sort -u | head -60

  # Homefield.xcodeproj 는 project.yml 에서 XcodeGen 으로 만든다.
  # PR 에서 project.yml 과 커밋된 프로젝트가 다르면 다시 생성해서 PR 브랜치에 커밋한다.
  xcodeproj:
    name: Xcode project sync
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Commit if changed
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git add -A Homefield.xcodeproj Homefield/Info.plist
          if git diff --cached --quiet; then
            echo "Homefield.xcodeproj is up to date"
            exit 0
          fi
          git diff --cached --stat
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::Homefield.xcodeproj 가 project.yml 과 다릅니다. xcodegen generate 를 실행해서 커밋해 주세요."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Xcode project from project.yml"
          git push
