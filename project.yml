name: Homefield
options:
  bundleIdPrefix: com.bravekoon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko

# 앱과 위젯 확장이 같은 버전을 쓴다 (버전 릴리스 때 여기만 올린다)
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    # 기기에서 바로 실행할 때 서명 팀. CI는 APPLE_TEAM_ID 시크릿으로 덮어쓴다
    DEVELOPMENT_TEAM: WK337QZLS3

packages:
  HomefieldCore:
    path: Packages/HomefieldCore

targets:
  Homefield:
    type: application
    platform: iOS
    sources:
      - Homefield
      - Shared
    dependencies:
      - package: HomefieldCore
      - target: HomefieldWidgets
    info:
      path: Homefield/Info.plist
      properties:
        CFBundleDisplayName: 홈구장
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: 선수 등장곡과 응원가를 Apple Music에서 재생하기 위해 사용합니다.
        NSLocationWhenInUseUsageDescription: 야구장에서 직관을 인증할 때 지금 계신 곳이 야구장 안인지 확인하기 위해 사용합니다. 좌표는 저장하거나 보내지 않습니다.
        NSPhotoLibraryUsageDescription: 선수 사진을 앨범에서 고를 때 사용합니다.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bravekoon.homefield
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # 잠금화면·다이내믹 아일랜드 실시간 중계 (Live Activity)
  HomefieldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HomefieldWidgets
      - Shared
    info:
      path: HomefieldWidgets/Info.plist
      properties:
        CFBundleDisplayName: 홈구장
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bravekoon.homefield.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  Homefield:
    build:
      targets:
        Homefield: all
    test:
      targets:
        - package: HomefieldCore/HomefieldCoreTests
