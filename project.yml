name: Homefield
options:
  bundleIdPrefix: com.bravekoon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko

packages:
  HomefieldCore:
    path: Packages/HomefieldCore

targets:
  Homefield:
    type: application
    platform: iOS
    sources:
      - Homefield
    dependencies:
      - package: HomefieldCore
    info:
      path: Homefield/Info.plist
      properties:
        CFBundleDisplayName: 홈구장
        CFBundleDevelopmentRegion: ko
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        NSAppleMusicUsageDescription: 선수 등장곡과 응원가를 Apple Music에서 재생하기 위해 사용합니다.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bravekoon.homefield
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Homefield:
    build:
      targets:
        Homefield: all
    test:
      targets:
        - package: HomefieldCore/HomefieldCoreTests
